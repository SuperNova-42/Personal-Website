{% extends "base.html" %}

{% block title %}
Projects | Alexander Dacunha
{% endblock %}

{% block content %}
<h1>Projects</h1>

<div class="link-grid">
    <div class="project-list-header">
        <span>Name</span>
        <span>Category</span>
    </div>
    {% for key, project in projects.items() %}
        <a href="{{ url_for('project_details', project=key) }}" class="link-container">
            <span class="project-title">{{ project.name }} </span>
            <span class="project-title">{{project.category}} </span>
        </a>
    {% endfor %}
</div>


{% endblock %}
